; Laremit — application container PHP settings.
; Production/Octane tuning is revisited in Phase 8 (ADR-008).

memory_limit = 512M
max_execution_time = 60
expose_php = Off
date.timezone = UTC

; Money is handled as integer minor units; never let PHP round for us.
serialize_precision = -1

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Dev default: pick up edits on the bind mount. Phase 8 sets this to 0.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; phpredis: fail fast rather than hanging a request behind a dead Redis.
redis.session.locking_enabled = 0
