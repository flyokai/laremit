# Queue instance — holds jobs that represent work we have already promised to do
# (charges, webhook processing). An eviction here is a silently dropped payment.
#
# noeviction is the whole point of splitting this instance out: under memory
# pressure Redis returns OOM to the producer and Horizon retries, instead of
# quietly deleting a ChargeJob. (ADR-002)

appendonly yes
appendfsync everysec
save 900 1

maxmemory 512mb
maxmemory-policy noeviction
