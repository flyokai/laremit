# Queue instance — holds jobs that represent work we have already promised to do
# (charges, webhook processing). An eviction here is a silently dropped payment.
#
# noeviction is the whole point of splitting this instance out: under memory
# pressure Redis returns OOM to the producer and Horizon retries, instead of
# quietly deleting a ChargeJob. (ADR-002)

appendonly yes
appendfsync everysec
save 900 1

# 2gb, up from ADR-002's original 512mb sizing (amended by ADR-007): the queue
# isolation demo parks 1,000,000 synthetic jobs on the events lane on purpose
# (~600MB of payloads), and Horizon's per-job metering during the drain holds
# another payload copy per in-flight hour. Sized so the demo exercises worker
# isolation, not this instance's OOM behavior — which stays noeviction, because
# under REAL memory pressure refusing new work (backpressure the producer can
# see) beats silently deleting promised work.
maxmemory 2gb
maxmemory-policy noeviction
