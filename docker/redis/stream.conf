# Event stream instance — the Phase 2 ingest buffer (Redis Streams + consumer groups).
#
# Sized and policed separately from the queue because its load profile is the
# opposite: high-volume, bursty, and bounded by app-side XADD MAXLEN trimming
# rather than by eviction. noeviction means a burst that outruns the consumers
# surfaces as a write error we can shed on, not as silent event loss. (ADR-002)

appendonly yes
appendfsync everysec
save ""

maxmemory 1gb
maxmemory-policy noeviction

# Pending-entry lists are read by XAUTOCLAIM during consumer recovery; keep the
# radix tree nodes small enough that a crashed consumer's PEL scan stays cheap.
stream-node-max-entries 100
